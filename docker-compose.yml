version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    container_name: jastip-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: jastip_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache
  redis:
    image: redis:7-alpine
    container_name: jastip-redis
    restart: always
    ports:
      - "6379:6379"

  # Object Storage
  minio:
    image: minio/minio
    container_name: jastip-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: MinioPassword123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jastip-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:12345@postgres:5432/jastip_db
      - JWT_SECRET=jastip_wirosari_super_secret_jwt_key_2024
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=jastip_wirosari_refresh_secret_2024
      - JWT_REFRESH_EXPIRES_IN=30d
      - PORT=3000
      - NODE_ENV=development
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=MinioPassword123!
      - MINIO_BUCKET=jastip-media
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - minio

  # Admin Panel
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: jastip-admin
    restart: unless-stopped
    ports:
      - "3001:3000" # Mapped to 3001 so it doesn't conflict with backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
